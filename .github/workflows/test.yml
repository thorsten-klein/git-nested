name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: ['*']

jobs:
  # Builds the standalone executable with the very script the release uses
  # (scripts/create-python-exe.sh), so a change that breaks the freeze -- a new
  # import, a moved data file -- fails here rather than on release day. The
  # script smoke-tests the binary it produces; release-binary.yml additionally
  # runs it across distros before attaching it to a release.
  binary:
    uses: ./.github/workflows/build-binary.yml
    with:
      artifact: git-nested-binary-ci

  # ... and then runs the full pytest suite through that executable, so a
  # binary that builds but does not work still fails the PR.
  binary-test:
    needs: binary
    uses: ./.github/workflows/test-binary.yml
    with:
      artifact: git-nested-binary-ci

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # SonarCloud's blame-based analysis (new-code detection, issue
          # authorship) needs real history, not the default shallow, tagless
          # checkout.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Setup project
        run: uv sync --frozen
      - name: git config
        run: |
          git config --global user.email "you@example.com";
          git config --global user.name "Your Name";
          git config --global init.defaultBranch "master";
          git config --global --add safe.directory "$PWD";
          git config --global --add safe.directory "$PWD.git";
      - name: Run poe all
        run: uv run poe all
      - name: Upload coverage reports to Codecov
        # Dependabot-triggered runs don't get repo secrets, so skip rather than fail.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' && secrets.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && secrets.CODECOV_TOKEN != '' }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: SonarCloud Scan
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' && secrets.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
