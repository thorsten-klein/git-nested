name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

# One run per branch/PR at a time. On a PR a newer push cancels the run in
# progress: only the newest commit's results matter there, and waiting for a
# superseded run would hold its checks back by the length of a whole run. On
# main every run finishes, so each merged commit keeps its full results (a
# newer push waits; only the newest waiting run is kept).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Builds the standalone executable with the very script the release uses
  # (scripts/create-python-exe.sh), so a change that breaks the freeze -- a new
  # import, a moved data file -- fails here rather than on release day. The
  # script smoke-tests each binary it produces; release-binary.yml additionally
  # runs the Linux one across distros before attaching it to a release.
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux only for now: the macOS and Windows targets made every PR
          # wait for their slow runners. release-binary.yml still builds all
          # three; to check them on PRs again, add back
          #   - {target: macos, runs-on: macos-latest, container: ''}
          #   - {target: windows, runs-on: windows-latest, container: ''}
          - target: linux
            runs-on: ubuntu-26.04
            container: almalinux:8
    uses: ./.github/workflows/build-binary.yml
    with:
      artifact: git-nested-binary-ci-${{ matrix.target }}
      runs-on: ${{ matrix.runs-on }}
      container: ${{ matrix.container }}

  # ... and then runs the full pytest suite through the Linux executable, so a
  # binary that builds but does not work still fails the PR. Linux only: the
  # suite is the same suite either way, and what it is checking here is that
  # freezing did not drop anything -- a per-platform answer the smoke test in
  # create-python-exe.sh already gives for the other two.
  binary-test:
    needs: binary
    uses: ./.github/workflows/test-binary.yml
    with:
      artifact: git-nested-binary-ci-linux

  test:
    runs-on: ${{ matrix.os }}
    # The steps are written for bash; on windows-latest the default would be
    # PowerShell. Git for Windows ships bash on every runner.
    defaults:
      run:
        shell: bash
    strategy:
      # One OS failing must not cancel the others: a Windows-only break should
      # still show whether Linux and macOS pass.
      fail-fast: false
      matrix:
        # Every supported Python on Linux; macOS and Windows, whose runners are
        # far slower, on the newest Python only.
        os: [ubuntu-26.04]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python-version: '3.14'
          - os: windows-latest
            python-version: '3.14'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # SonarCloud's blame-based analysis (new-code detection, issue
          # authorship) needs real history, not the default shallow, tagless
          # checkout.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Setup project
        run: uv sync --frozen
      - name: git config
        run: |
          git config --global user.email "you@example.com";
          git config --global user.name "Your Name";
          git config --global init.defaultBranch "master";
          git config --global --add safe.directory "$PWD";
          git config --global --add safe.directory "$PWD.git";
      - name: Run poe all
        run: uv run poe all
      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-26.04' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
      - name: SonarCloud Scan
        if: matrix.os == 'ubuntu-26.04' && matrix.python-version == '3.14'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
