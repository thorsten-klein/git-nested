name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

# One run per branch/PR at a time -- a new commit cancels whatever this
# workflow is still running for the same ref. Not on main: every push there
# is a merge, and each one should run to completion rather than being
# canceled by the next.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Builds the standalone executable with the very script the release uses
  # (scripts/create-python-exe.sh), so a change that breaks the freeze -- a new
  # import, a moved data file -- fails here rather than on release day. All
  # three targets, because a break is usually a break on one of them only. The
  # script smoke-tests each binary it produces; release-binary.yml additionally
  # runs the Linux one across distros before attaching it to a release.
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel macOS is deliberately absent: those runners are gone, and
          # the arm64 binary is what a current Mac needs.
          - target: linux
            runs-on: ubuntu-latest
            container: almalinux:8
          - target: macos
            runs-on: macos-latest
            container: ''
          - target: windows
            runs-on: windows-latest
            container: ''
    uses: ./.github/workflows/build-binary.yml
    with:
      artifact: git-nested-binary-ci-${{ matrix.target }}
      runs-on: ${{ matrix.runs-on }}
      container: ${{ matrix.container }}

  # ... and then runs the full pytest suite through the Linux executable, so a
  # binary that builds but does not work still fails the PR. Linux only: the
  # suite is the same suite either way, and what it is checking here is that
  # freezing did not drop anything -- a per-platform answer the smoke test in
  # create-python-exe.sh already gives for the other two.
  binary-test:
    needs: binary
    uses: ./.github/workflows/test-binary.yml
    with:
      artifact: git-nested-binary-ci-linux

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # SonarCloud's blame-based analysis (new-code detection, issue
          # authorship) needs real history, not the default shallow, tagless
          # checkout.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Setup project
        run: uv sync --frozen
      - name: git config
        run: |
          git config --global user.email "you@example.com";
          git config --global user.name "Your Name";
          git config --global init.defaultBranch "master";
          git config --global --add safe.directory "$PWD";
          git config --global --add safe.directory "$PWD.git";
      - name: Run poe all
        run: uv run poe all
      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: SonarCloud Scan
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
