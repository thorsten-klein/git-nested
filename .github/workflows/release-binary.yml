name: Release binary

# Builds the single-file 'git-nested' executable (see
# scripts/create-python-exe.sh) and attaches
# git-nested-<version>-x64-linux.tar.xz to the release, so git-nested can be
# used on a machine that has no python -- and no pip, no uv -- at all.
#
# Separate from publish.yml on purpose. That one is triggered by the tag push
# and uploads to PyPI, while attaching an asset needs the GitHub *release* to
# already exist, which is only guaranteed once it is published.
on:
  release:
    types: [published]
  # on-demand -- builds and verifies without touching any release. Give 'tag'
  # to also (re-)attach the asset to an existing release, e.g. after fixing
  # the build for one already published.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build from and attach the asset to (empty: build + verify only)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  # The release this builds. Its tag is what setuptools-scm turns into the
  # version frozen into the binary, so checking out anything else would
  # produce an executable that misreports itself. Empty on a plain
  # workflow_dispatch -- then the triggering ref is built as-is.
  REF: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

jobs:
  # the glibc floor and every other build decision live there, shared with
  # test.yml so both exercise the same executable. 'env.REF' is not available
  # to a reusable workflow's inputs, so the ref is spelled out again.
  build:
    uses: ./.github/workflows/build-binary.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      artifact: git-nested-binary

  # The whole pytest suite, driven through the binary that is about to be
  # attached -- the check that it is functionally complete, not just startable.
  test:
    needs: build
    uses: ./.github/workflows/test-binary.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      artifact: git-nested-binary

  # Proves the "runs on any x86_64 Linux" claim rather than assuming it. The
  # binary is dropped into stock distro images that have no python installed,
  # and has to drive a real nested repo end to end there.
  verify:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the glibc floor it was built against, and the oldest still-
          # supported LTS releases -- the ones a modern-runner build breaks
          - image: almalinux:8
            install: dnf -y install git
          - image: ubuntu:22.04
            install: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git
          - image: debian:12
            install: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git
          # ... plus the current end of the range, where a binary built too
          # old would fail instead
          - image: ubuntu:24.04
            install: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git
          - image: fedora:latest
            install: dnf -y install git
          - image: archlinux:latest
            install: pacman -Sy --noconfirm git
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: git-nested-binary

      # Named git-nested-<version>-x64-linux.tar.xz -- resolved by glob since
      # the version isn't known here.
      - name: Unpack
        run: tar -xf git-nested-*-x64-linux.tar.xz

      # git is the one thing that does have to be installed -- git-nested
      # drives it and refuses to start without it. Python deliberately is not:
      # if any of these images had to install it, the binary would not be
      # doing its job.
      - name: Write the verification script
        run: |
          cat > verify.sh <<'EOF'
          set -eu
          if command -v python3 >/dev/null; then
              echo "note: this image happens to ship python3; the binary does not use it"
          else
              echo "note: no python3 in this image at all"
          fi

          git-nested --version

          # invoked as `git nested`, the way users run it: git finds the
          # subcommand by looking for a 'git-nested' on PATH.
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch master
          git config --global --add safe.directory '*'

          mkdir -p /tmp/repo/doc
          cd /tmp/repo
          git init -q
          touch doc/README.md
          git add -A
          git commit -qm "initial"

          git nested init doc
          test -f doc/.gitnested
          cat doc/.gitnested
          git nested status
          EOF

      # The binary and the script are mounted in, so the distro images need
      # neither tar/xz nor anything else to take part beyond git -- the point
      # is that nothing else is required. 'git-nested' is now a symlink to the
      # versioned binary, so both have to be mounted together (into PATH)
      # rather than just the single file -- a lone symlink mount would
      # dangle, pointing at a sibling that was never brought along.
      - name: Run on ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            ${{ matrix.image }} \
            sh -c '${{ matrix.install }} >/dev/null && export PATH="/work:$PATH" && sh verify.sh'

  upload:
    # 'build' listed directly (not just transitively via 'test'/'verify')
    # because a job's outputs are only visible to jobs that name it in
    # 'needs'.
    needs: [build, test, verify]
    # nothing to attach when workflow_dispatch ran without a tag
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: git-nested-binary

      # --clobber so re-running against an already-attached release replaces
      # the asset instead of failing halfway. The filename is composed from
      # 'build's version output -- this is the point that actually names the
      # release asset, so it uses the real version rather than a glob.
      - name: Attach git-nested-${{ needs.build.outputs.version }}-x64-linux.tar.xz to ${{ env.REF }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE: git-nested-${{ needs.build.outputs.version }}-x64-linux.tar.xz
        run: gh release upload "$REF" "$ARCHIVE" --clobber
