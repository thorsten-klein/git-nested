name: Build binary

# Builds the standalone 'git-nested' executable and uploads it as an artifact.
# Called by test.yml (so every push/PR proves the recipe still builds) and by
# release-binary.yml (which attaches it to the release) -- so what CI exercises
# is built by exactly the recipe that ships, rather than a lookalike that can
# drift away from it.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit/tag/branch to build. Empty: whatever triggered the caller.'
        type: string
        required: false
        default: ''
      artifact:
        description: 'Name of the uploaded artifact'
        type: string
        required: false
        default: git-nested-binary
    outputs:
      version:
        description: 'Version of the built git-nested, e.g. 1.2.3 -- for composing the exact git-nested-<version>-x64-linux.tar.xz filename in a caller'
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    # A PyInstaller binary links the glibc of the machine that built it, and
    # glibc is only backward compatible -- built on ubuntu-latest it would
    # refuse to start on anything older than that runner. AlmaLinux 8 has
    # glibc 2.28, the oldest that still runs the node20 the actions below
    # need, which covers every distro from Ubuntu 20.04 / Debian 10 /
    # Fedora 29 / RHEL 8 onwards. glibc-based distros only -- musl ones
    # (Alpine) can never run this binary.
    container: almalinux:8
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      # Before the checkout -- without git, actions/checkout silently falls
      # back to downloading a tarball, and a checkout with no .git has no
      # tags for setuptools-scm to derive the version from.
      - name: Install build prerequisites
        run: dnf -y install python3.12 python3.12-pip git tar xz

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # the version frozen into the binary comes from the tags, and the
          # default shallow checkout fetches none of them.
          fetch-depth: 0

      # the checkout is owned by a different user than this container's root,
      # which git refuses to read from until told it is not a security issue.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build the executable
        id: build
        run: |
          scripts/create-python-exe.sh --output dist --python python3.12
          # 'git-nested Version: X.Y.Z' -> X.Y.Z. Exposed as a job output so a
          # caller can compose the exact git-nested-<version>-x64-linux.tar.xz
          # filename itself (e.g. release-binary.yml's 'gh release upload')
          # instead of globbing for it.
          echo "version=$(dist/git-nested --version | head -1 | cut -d' ' -f3)" >> "$GITHUB_OUTPUT"

      # the .tar.xz rather than the bare executable. It is what a release
      # actually ships, and unlike a zipped artifact it keeps the exec bit,
      # so consumers just untar and run it. Named git-nested-<version>-x64-linux
      # by create-python-exe.sh, so the version can't be spelled out here --
      # matched by glob instead (see steps.build.outputs.version for callers
      # that need the exact name).
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact }}
          path: dist/git-nested-*-x64-linux.tar.xz
          if-no-files-found: error
