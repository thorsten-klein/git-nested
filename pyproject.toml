[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-nested"
dynamic = ["version"]
description = "Git Submodule Alternative"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0,<7",
]
authors = [
    {name = "Thorsten Klein", email = "thorsten.klein.git@gmail.com"}
]
keywords = ["git", "nested", "submodule", "nested"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Version Control :: Git",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
git-nested = "git_nested:main"

[project.urls]
Homepage = "https://github.com/thorsten-klein/git-nested"
Documentation = "https://github.com/thorsten-klein/git-nested#readme"
Repository = "https://github.com/thorsten-klein/git-nested"
Issues = "https://github.com/thorsten-klein/git-nested/issues"

[dependency-groups]
lint = [
    "bandit>=1.8.0",
    "complexipy>=7.0.0",
    "mypy~=1.14",
    "pip-audit>=2.9.0",
    "pre-commit>=4.3.0",
    "pyright~=1.1",
    "ruff~=0.13",
    "types-pyyaml>=6.0.12.20250915",
]
test = [
    "coverage>=7.10",
    "pytest>=8.4,<10.0",
    "pytest-xdist>=3.0.0",
    "pytest-cov>=7.0",
    "pytest-mock>=3.6.1",
    "pytest-flakefinder>=1.1.0",
]
dev = [
    "poethepoet~=0.37",
    {include-group = "lint"},
    {include-group = "test"},
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Applied by path in tests/conftest.py's pytest_collection_modifyitems, not by
# decorator -- the directory a test lives in already says which it is.
markers = [
    "unit: fast, no real git (tests/unit)",
    "e2e: shells out to real git (tests/e2e)",
]
addopts = "--strict-markers"

[tool.coverage.run]
# `--cov=git_nested` resolves through the editable install's site-packages
# path. Without this remapping coverage.xml records site-packages filenames,
# and SonarQube -- which is told `sonar.sources=src` -- silently reports 0%.
relative_files = true

[tool.coverage.paths]
source = ["src/git_nested", "*/site-packages/git_nested"]

[tool.coverage.report]
fail_under = 100
show_missing = true
# `if TYPE_CHECKING:` bodies never execute at runtime, so they are not
# reachable statements -- without this they would count against the 100% gate.
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "1.0.0"

[tool.setuptools.package-data]
# The previous glob ("*" = ["*.sh", "*.bash"]) matched nothing: there was no
# package, and no shell scripts under the module's directory.
"git_nested" = ["py.typed"]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH", "RET", "ARG", "C4", "RUF", "D", "T20", "TRY", "PL"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "TRY003",  # GitNestedError carries the user-facing message; that IS the long
               # message outside the exception class, and there is one exception class
    "PLR0913", # complexipy caps cognitive complexity at 5, which forces functions to
               # be split, which pushes their state out into parameters. The two rules
               # pull opposite ways and complexipy is the one measuring readability
    "PLR2004", # what it finds here is `len(parts) != 2` -- naming that 2 hides it
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# unused fixture/mock-callback arguments are idiomatic pytest, not a smell;
# a test's own name is its documentation, so docstrings aren't required; and
# an end-to-end test is a long straight line of steps by nature (PLR0915).
"tests/**" = ["ARG001", "ARG002", "ARG005", "D", "PLR0915"]
# the one place allowed to write to stdout -- everything else goes through it.
"src/git_nested/output.py" = ["T201"]

[tool.ruff.format]
quote-style = "preserve"
line-ending = "lf"
# Enable preview mode for Github Annotations added in 0.13.3
preview = true

[tool.complexipy]
paths = ["src", "tests"]
max-complexity-allowed = 5
failed = true
color = "auto"
sort = "asc"

[tool.mypy]
python_version = "3.10"
files = ["src"]

[tool.pyright]
pythonVersion = "3.10"
include = ["src"]

[tool.bandit]
# git-nested's whole job is orchestrating git as a subprocess -- these fire on
# every single one of those call sites:
#   B404 -- merely importing subprocess
#   B603 -- subprocess.run called with a list argv and no shell=True (that's
#           the *safe* pattern these checks exist to push people towards)
#   B607 -- invoking a PATH-resolved executable ("git") rather than a
#           hardcoded absolute path, which would break on every dev machine
skips = ["B404", "B603", "B607"]

[tool.poe.tasks]
all = ["lock-check", "pre-commit", "lint", "format", "mypy", "pyright", "bandit", "pip-audit", "complexity", "test"]
# Every workflow installs with `uv sync --frozen`, so a pyproject dependency
# edit without a matching `uv lock` fails in CI as an opaque sync error. This
# turns that into a local, named failure instead. It is a poe task rather than
# a pre-commit hook on purpose: this file's header rules out duplicating a
# pinned tool there, and a uv-pre-commit hook would be a second, independently
# pinned uv drifting from the one CI runs.
"lock-check" = "uv lock --check"
"pre-commit" = "pre-commit run --all-files --show-diff-on-failure"
format = "ruff format ."
lint = "ruff check ."
mypy = "mypy"
pyright = "pyright"
bandit = "bandit -c pyproject.toml -r src"
"pip-audit" = "pip-audit --skip-editable"
complexity = "complexipy"
# Fast inner loop: the unit tests only, and deliberately WITHOUT --cov --
# `fail_under = 100` would otherwise fail every partial run.
test-unit = {cmd = "pytest -v -n=auto -W error -m unit", env = {PYTHONIOENCODING = "utf-8"}}
flakefinder = "pytest -n=auto -W error --flake-finder --flake-runs=200"
test = {cmd = "pytest -v -n=auto -W error --cov-config=pyproject.toml --cov=git_nested --junitxml=junit.xml -o junit_family=legacy --cov-report=term --cov-report=html --cov-report=xml", env = {PYTHONIOENCODING = "utf-8"}}

# Build the standalone executable, then run the whole suite through it
# (GIT_NESTED_EXE makes conftest drive `git nested` on PATH instead of the
# module). Same two steps CI runs; see scripts/create-python-exe.sh.
exe = "scripts/create-python-exe.sh"
test-exe = ["exe", {cmd = "pytest -v -n=auto -W error", env = {PYTHONIOENCODING = "utf-8", GIT_NESTED_EXE = "dist/git-nested"}}]

clean = "rm -rf dist/ build/ *.egg-info src/*.egg-info"
build = ["clean", {cmd = "uv build"}]
publish-test = {cmd = "uv publish --publish-url https://test.pypi.org/legacy/"}
publish = "uv publish"
